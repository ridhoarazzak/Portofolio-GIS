# ============================================================
# PORTFOLIO CONFIGURATION
# This file is in the YAML format and is very sensitive to 
# spaces. Ensure to match the indentation level and spacing
# of new items with existing ones

# Edit all lines marked [YOUR ...] to customize your site
# ============================================================

site_name: "Ridho Arazzak - Portofolio Geospasial"
site_description: "Portofolio Ridho Arazzak — Geospatial Data Scientist dan Conservation Technologist, Solok Selatan"
site_author: "Ridho Arazzak"
# After your site is live, uncomment and set this to your actual GitHub Pages URL:
site_url: "https://ridhoarazzak.github.io/portfolio-website-late_RA/"

theme:
  name: material
  language: id
  # Icon used as both the site logo (header) and browser favicon.
  # Browse icons at https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
  # and replace "material/earth" with any "material/..." icon name you prefer.
  icon:
    logo: material/earth
  palette:
    # To change the color, edit the 'primary' and 'accent' values below for both
    # the 'default' (light) and 'slate' (dark) schemes.
    # Available colors: red, pink, purple, deep purple, indigo, blue, light blue,
    # cyan, teal, green, light green, lime, yellow, amber, orange, deep orange
    - scheme: default            # Light mode
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate              # Dark mode
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs            # Top-level nav items shown as horizontal tabs
    - navigation.top             # Back-to-top button when scrolling up
    - content.code.copy          # Copy button on all code blocks
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - md_in_html        # Allows Markdown inside HTML blocks (used for project cards)
  - attr_list         # Allows adding CSS classes to elements: ![img](url){ .class }
  - admonition        # Note/warning/tip boxes
  - pymdownx.details  # Collapsible admonition blocks
  - pymdownx.superfences
  - tables
  - pymdownx.emoji:   # Renders :material-icon: and :fontawesome-brands-icon: inline icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: "Copyright &copy; Ridho Arazzak"

extra:
  social:
    - icon: material/web
      link: https://ssdi.vercel.app
    - icon: fontawesome/brands/github
      link: https://github.com/ridhoarazzak
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/search/results/people/?keywords=Ridho%20Arazzak
    - icon: material/email
      link: mailto:mrg.ridhoarazzak@gmail.com


plugins:
  - search
  - meta

nav:
  - Beranda: index.md
  - Proyek:
    - "Semua Proyek": projects/index.md
    - "SSDI Solok Selatan": projects/ssdi-solsel.md
    - "Analisis Kalurahan Petir": projects/petir-gunungkidul.md
    - "Peta Skrining Sungai Solsel": projects/skrining-sungai-solsel.md
    - "Estimasi Panen Sawah Solsel": projects/panen-solsel-2025.md
    # Proyek baru: salin salah satu file di docs/projects/, edit, lalu tambah baris di sini
    # dan kartu di docs/projects/index.md
  - Pengalaman: experience.md
  - Kontak: contact.md
  
